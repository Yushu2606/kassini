servers:

  - bind:
    - address: '*:8084'
      protocols:
      - http1

    endpoints:

    - route: /
      body: <h1>Hello World<h1>
      contentType: text/html

    - route: /profile
      body: <h1>Your profile<h1>
      policy: Kassini

    authentication:
      mode: BrowserToken
      browserToken: local-demo-token

      # External provider examples:
